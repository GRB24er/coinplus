name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # NOTE: `next build` is intentionally not part of CI yet. The data layer
      # currently fetches CoinGecko (and Google Fonts) at build time, so a build
      # needs live network access and secrets. Once the Tier 2 backend-for-frontend
      # lands and fonts are self-hosted, add a hermetic `npm run build` step here.
